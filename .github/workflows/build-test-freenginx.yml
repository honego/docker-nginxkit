---
name: "Build test freenginx"

on:
  push:
    paths:
      - "freenginx/**"
      - "!freenginx/**/*.md"
  pull_request:
    paths:
      - "freenginx/**"
      - "!freenginx/**/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WORK_DIR: freenginx

jobs:
  build:
    name: "Build test image"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux/amd64 }
          - { os: ubuntu-24.04-arm, platform: linux/arm64 }
    runs-on: ${{ matrix.os }}

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7

      - name: "Resolve upstream versions"
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "NGX_VERSION=$(gh api --paginate repos/freenginx/nginx/tags \
            --jq '.[] | select(.name | test("^release-[0-9]+\\.[0-9]+\\.[0-9]+$")) | .name | sub("^release-"; "")' | sort -V | tail -n 1)" >> "$GITHUB_ENV"
          echo "NGX_GEOIP2_VERSION=$(gh api --paginate repos/leev/ngx_http_geoip2_module/tags --jq '.[].name' | sort -V | tail -n 1)" >> "$GITHUB_ENV"
          echo "HEADERS_MORE_VERSION=$(gh api --paginate repos/openresty/headers-more-nginx-module/tags --jq '.[].name | sub("^v"; "")' | sort -V | tail -n 1)" >> "$GITHUB_ENV"
          echo "NGX_ZSTD_VERSION=$(gh api repos/facebook/zstd/releases/latest --jq '.tag_name | sub("^v"; "")')" >> "$GITHUB_ENV"

      - name: "Build freenginx"
        working-directory: ${{ env.WORK_DIR }}
        shell: bash
        run: |
          dpkg --print-architecture 2>/dev/null || uname -m

          set -euxo pipefail
          docker build \
            --no-cache \
            --progress=plain \
            --platform ${{ matrix.platform }} \
            --build-arg NGX_VERSION=${{ env.NGX_VERSION }} \
            --build-arg NGX_GEOIP2_VERSION=${{ env.NGX_GEOIP2_VERSION }} \
            --build-arg HEADERS_MORE_VERSION=${{ env.HEADERS_MORE_VERSION }} \
            --build-arg NGX_ZSTD_VERSION=${{ env.NGX_ZSTD_VERSION }} \
            --tag $GITHUB_REPOSITORY_OWNER/freenginx:${{ env.NGX_VERSION }}-$(dpkg --print-architecture) \
            . 2>&1 | tee build.log

          docker run --rm \
            --entrypoint freenginx \
            $GITHUB_REPOSITORY_OWNER/freenginx:${{ env.NGX_VERSION }}-$(dpkg --print-architecture) \
            -V
